  model:claude: { en: "Claude models in general", ru: "модели Claude вообще" }
  model:gpt-6.1: { en: "OpenAI's GPT-6.1 line (Terra, Sol)", ru: "линейка GPT-6.1 от OpenAI (Terra, Sol)" }
  company:anthropic: { en: "Anthropic", ru: "Anthropic" }
  company:openai: { en: "OpenAI", ru: "OpenAI" }
  company:google: { en: "Google", ru: "Google" }
