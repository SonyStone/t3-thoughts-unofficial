  product:boat: { en: "boat.dev, cloud Linux VMs (sandboxes) for agents", ru: "boat.dev, облачные Linux-ВМ (песочницы) для агентов" }
  model:opus-5.5: { en: "Claude Opus 5.5", ru: "Claude Opus 5.5" }
