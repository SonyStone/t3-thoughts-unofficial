# Old name → canonical one. The site replaces it on reading; Opus writes the canonical one.
aliases:
  t3-code: product:t3-code
  t3-chat: product:t3-chat
  codex: product:codex
  antigravity: product:antigravity
  opus: model:opus
  claude: model:claude
  openai: company:openai
  github: company:github
  app-store: company:apple
  mcp: tech:mcp
  acp: tech:acp
  tmux: tech:tmux
  ios: tech:ios
  ci: tech:ci
  boat: product:boat
  terminal: tech:terminal

# Tag → the tags it brings along, applied down the chain: opus-5.5 → opus → claude → anthropic.
implies:
  model:opus-5.5: [model:opus]
  model:opus: [model:claude]
  model:claude: [company:anthropic]
  product:claude-code: [company:anthropic]
  product:codex: [company:openai]
  product:antigravity: [company:google]
  model:gpt-6.1: [company:openai]
  subagents: [agents]
  orchestration: [agents]

# Tags that repeat an entry's fields (kind); the site drops them.
drop: [repost, video]
