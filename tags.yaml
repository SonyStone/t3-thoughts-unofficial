# The T3 Thoughts tag vocabulary.
# Two readers: Opus tags the entries by it, and the site takes descriptions,
# aliases and implications from it (site/content-plugin.ts).
#
# Descriptions: { en: ..., ru: ... }, English first. A new tag needs only en; ru can come later.
#
# A tag is a lowercase, hyphenated string, with a namespace or without:
#   product:t3-code, model:opus-5.5, mood:salty, agents
# Without a namespace it is a topic.

namespaces:
  product: { en: "a product or service (his own or someone else's) — t3-code, t3-chat, codex, cursor", ru: "продукт или сервис (свой или чужой) — t3-code, t3-chat, codex, cursor" }
  model: { en: "a specific model or model family — opus-5.5, gpt-6.1, claude, grok", ru: "конкретная модель или семейство — opus-5.5, gpt-6.1, claude, grok" }
  company: { en: "a company — anthropic, openai, google, vercel", ru: "компания — anthropic, openai, google, vercel" }
  person: { en: "a person the post is about, by X handle without @ — jullerino, sama", ru: "человек, о котором идёт речь, по хэндлу X без @ — jullerino, sama" }
  tech: { en: "a technology, language, protocol or dev tool — tmux, mcp, react, ios", ru: "технология, язык, протокол, инструмент разработки — tmux, mcp, react, ios" }
  mood: { en: "Theo's own tone in the post, exactly one per entry", ru: "тон самого Theo в посте, ровно один на запись" }
  format: { en: "what kind of entry this is, one or two per entry", ru: "что это за запись по сути, один-два на запись" }

# The allowed values of the closed namespaces.
mood: [hype, salty, joking, tired, serious, curious, proud, annoyed]
format: [how-to, take, news, announcement, answer, prediction, opinion-change, behind-the-scenes]

# Known tags and what they mean. A new tag may be added when none fits.
tags:
