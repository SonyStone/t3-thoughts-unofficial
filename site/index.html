<!doctype html>
<html lang="en" translate="no">
  <head>
    <meta charset="UTF-8" />
    <!-- the site has its own languages (EN/RU switch), so no browser translation prompt -->
    <meta name="google" content="notranslate" />
    <!-- X serves images and videos only to requests without a foreign referrer -->
    <meta name="referrer" content="no-referrer" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>T3 Thoughts (unofficial)</title>
    <meta name="description" content="An unofficial digest of Theo Browne's posts and videos: the useful ones, broken down, searchable by tag. Not affiliated with Theo Browne or T3 Tools." />
    <meta name="theme-color" content="#ff4fa3" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <!-- link previews (Discord, Slack, Telegram, X): the image needs the site's full address
         (scripts/og.mjs draws it) -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="T3 Thoughts (unofficial)" />
    <meta property="og:title" content="T3 Thoughts (unofficial)" />
    <meta property="og:description" content="An unofficial digest of Theo Browne's posts and videos: the useful ones, broken down, searchable by tag." />
    <meta property="og:url" content="https://sonystone.github.io/t3-thoughts-unofficial/" />
    <meta property="og:image" content="https://sonystone.github.io/t3-thoughts-unofficial/og.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="T3 Thoughts: Theo stands in a bowing crowd, with an UNOFFICIAL ribbon in the corner" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="T3 Thoughts (unofficial)" />
    <meta name="twitter:description" content="An unofficial digest of Theo Browne's posts and videos: the useful ones, broken down, searchable by tag." />
    <meta name="twitter:image" content="https://sonystone.github.io/t3-thoughts-unofficial/og.jpg" />
  </head>

    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
